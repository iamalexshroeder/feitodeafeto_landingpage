# Deploy na Netlify: site estático gerado pelo Astro em dist/.
# A Content-Security-Policy é gerada no build (scripts/build-csp.mjs → dist/_headers).

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Só a produção (feitodeafeto.com.br) é indexada pelo Google. Prévias de deploy e branches
# continuam com noindex e robots.txt bloqueando, para não aparecerem na busca.
[context.production.environment]
  SITE_URL = "https://feitodeafeto.com.br"
  PUBLIC_INDEXABLE = "true"

# Segurança básica para todas as páginas.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()"

# Arquivos com hash no nome (CSS/JS/fontes do build): cache de 1 ano.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Imagens e marca: 30 dias (os nomes não têm hash; ao trocar uma foto, o cache expira sozinho).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, stale-while-revalidate=86400"
